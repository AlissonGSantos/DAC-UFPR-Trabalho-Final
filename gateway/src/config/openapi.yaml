components:
  schemas:
    Endereco:
      type: object
      properties:
        cep:
          type: string
          description: CEP do endereço
          example: "12345-678"
        uf:
          type: string
          description: Estado do endereço
          example: "São Paulo"
        cidade:
          type: string
          description: Cidade do endereço
          example: "São Paulo"
        bairro:
          type: string
          description: Bairro do endereço
          example: "Centro"
        rua:
          type: string
          description: Rua do endereço
          example: "Avenida Paulista"
        numero:
          type: string
          description: Número do endereço
          example: "1000"
        complemento:
          type: string
          description: Complemento do endereço
          example: "Apto 101"

    Cliente:
      type: object
      properties:
        codigo:
          type: integer
          description: ID do cliente
          example: 1
        cpf: 
          type: string
          description: CPF do cliente
          example: "12345678900"
        nome:
          type: string
          description: Nome do cliente
          example: "João Silva"
        email:
          type: string
          description: Email do cliente
          example: "joao.silva@example.com"
        saldo_milhas:
          type: integer
          description: Quantidade de milhas do cliente
          example: 5000
        endereco:
          $ref: '#/components/schemas/Endereco'
          description: Endereço do cliente

    Funcionario:
      type: object
      properties:
        codigo:
          type: integer
          description: ID do funcionário
          example: 1
        cpf:
          type: string
          description: CPF do funcionário
          example: "12345678900"
        nome:
          type: string
          description: Nome do funcionário
          example: "Maria Oliveira"
        email:
          type: string
          description: Email do funcionário
          example: "maria.oliveira@emiratads.com"
        telefone:
          type: string
          description: Telefone do funcionário
          example: "(11) 91234-5678"
        ativo:
          type: boolean
          description: Status do funcionário (ativo/inativo)
          example: true

    Transacao:
      type: object
      properties:
        data:
          type: string
          format: date-time
          description: Data da transação
          example: "2023-10-01T10:00:00Z"
        codigo_reserva:
          type: String
          nullable: true
          description: ID da reserva associada à transação (se existente)
          example: "RES0001"
        quantidade_milhas:
          type: integer
          description: Quantidade de milhas da transação
          example: 1000
        valor:
          type: number
          format: float
          description: Valor em reais da transação
          example: 100.00
        descricao:
          type: string
          description: Descrição da transação
          example: "COMPRA DE MILHAS"
        tipo:
          type: string
          enum: [ENTRADA, SAIDA]
          description: Tipo da transação (entrada ou saída)
          example: "ENTRADA"

    Aeroporto:
      type: object
      properties:
        codigo:
          type: string
          description: Código do aeroporto
          example: "GRU"
        nome:
          type: string
          description: Nome do aeroporto
          example: "Aeroporto Internacional de São Paulo/Guarulhos - Governador André Franco Montoro"
        cidade:
          type: string
          description: Cidade onde o aeroporto está localizado
          example: "São Paulo"
        uf:
          type: string
          description: Unidade Federativa onde o aeroporto está localizado
          example: "SP"

    Voo: 
      type: object
      properties:
        codigo:
          type: string
          description: Código do voo
          example: "TADS1234"
        data:
          type: string
          format: date-time
          description: Data e hora do voo
          example: "2023-10-01T10:00:00Z"
        valor_passagem:
          type: number
          format: float
          description: Valor da passagem
          example: 500.00
        quantidade_poltronas_total:
          type: integer
          description: Quantidade total de poltronas no voo
          example: 100
        quantidade_poltronas_ocupadas:
          type: integer
          description: Quantidade de poltronas ocupadas no voo
          example: 50
        poltronas_ocupadas:
          type: array
          nullable: true
          items:
            type: integer
            description: Número da poltrona ocupada
            example: 10
        estado:
          type: string
          enum: [CONFIRMADO, CANCELADO, REALIZADO]
          description: Estado do voo (Confirmado, Cancelado ou Realizado)
          example: "CONFIRMADO"
        aeroporto_origem:
          $ref: '#/components/schemas/Aeroporto'
          description: Aeroporto de origem do voo
        aeroporto_destino:
          $ref: '#/components/schemas/Aeroporto'
          description: Aeroporto de destino do voo

    Reserva:
      type: object
      properties:
        codigo:
          type: string
          description: Código da reserva
          example: "RES0001"
        codigo_cliente:
          type: integer
          description: ID do cliente associado à reserva
          example: 1
        data:
          type: string
          format: date-time
          description: Data e hora da última atualização da reserva
          example: "2023-10-01T10:00:00Z"
        voo:
          $ref: '#/components/schemas/Voo'
          description: Detalhes do voo associado à reserva
        estado:
          type: string
          enum: [CRIADA, CHECKIN, EMBARCADA, CANCELADA, CANCELADA VOO, REALIZADA, NAO REALIZADA]
          description: Estado da reserva (Criada, Check-in, Embarcada, Cancelada, Cancelada Voo, Realizada ou Não Realizada)
          example: "CRIADA"
        quantidade_milhas:
          type: integer
          description: Quantidade de milhas utilizadas na reserva
          example: 1000
        poltronas_reservadas:
          type: array
          items:
            type: integer
            description: Número da poltrona reservada
            example: 10
