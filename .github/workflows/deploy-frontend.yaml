name: Build and Deploy Frontend

on:
  push:
    branches: ["development"]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
    build_and_deploy:
      name: Build and Deploy Frontend
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Get version from package.json
          id: get_version
          run: |
            version=$(jq -r '.version' frontend/emiratads/package.json)
            echo "version=$version" >> $GITHUB_ENV

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build da imagem docker
          uses: docker/build-push-action@v6
          with:
            push: true
            context: frontend/emiratads
            file: frontend/emiratads/Dockerfile
            tags: "${{ vars.DOCKERHUB_REPOSITORY }}-frontend:latest,${{ vars.DOCKERHUB_REPOSITORY }}-frontend:${{ steps.get_version.outputs.version }}"
