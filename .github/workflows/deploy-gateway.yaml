name: build and deploy gateway

on:
  push:
    branches: ["development"]
    paths:
      - 'gateway/**'
  workflow_dispatch:

jobs:
    build_and_deploy:
        name: Build and Deploy Gateway
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Get version from package.json
          id: get_version
          run: |
            version=$(jq -r '.version' gateway/package.json)
            echo "version=$version" >> $GITHUB_ENV
    
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
    
        - name: Build da imagem docker
          uses: docker/build-push-action@v6
          with:
            push: true
            context: gateway/emiratads
            file: gateway/Dockerfile
            tags: "${{ vars.DOCKERHUB_REPOSITORY }}-gateway:latest,${{ vars.DOCKERHUB_REPOSITORY }}-gateway:${{ steps.get_version.outputs.version }}"