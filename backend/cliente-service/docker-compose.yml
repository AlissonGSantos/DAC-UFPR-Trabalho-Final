services:
  dbdevelopment:
    build:
      context: ../database
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_PASSWORD: senha0
    ports:
      - "5433:5432"
    networks:
      - emiratads-network

  clienteservice:
    build:
      context: .
      dockerfile: ../Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      - dbdevelopment
    networks:
      - emiratads-network

networks:
  emiratads-network:
    driver: bridge